name: MLP pre-flight

# Runs on every pull request and on pushes to main.
#
# An MLP installs into a live instance with no sandbox, so a defect in one is
# not a bug report, it is an outage. On 2026-09-11 ERP-Epicor 1.1.8 died
# mid-install on a demo instance with "Cannot redeclare class
# ErpDashboardReconcile", was never recorded in upgrade_history, and left that
# instance with its ERP modules gone and the Quotes list throwing. The defect
# was two install scripts loading one class from two different paths, visible
# in the source the whole time, and nothing looked for it.
#
# The rules and both scripts are taken from sugarcrm/erp-integration-sugar,
# where they were written after that incident. They are carried here rather
# than referenced because this repository builds and ships its own package to
# the same instances, and a gate that lives in somebody else's repository does
# not run on this one's pull requests.
#
# 🛑 G318: CARRIED, NOT COPIED. Through rc67 the carried linter was a hand-synced
# copy that had fallen to 17 of upstream's 19 rules, so this gate went green
# without MLP018 or MLP019 ever running - and MLP019 is the rule whose
# violation makes SugarCloud refuse a package mid-install. Both repositories
# are private and in different GitHub accounts, so CI cannot fetch upstream's
# file; instead it is VENDORED byte for byte and pinned by sha256 to one
# upstream commit (scripts/mlp_lint.PINNED.json). The first step below proves
# every vendored file is that commit's file before anything trusts it, and
# floors the rule set at MLP001-MLP019. Never edit the linter here: change it
# upstream and run `python3 scripts/refresh_mlp_lint.py`.
#
# This package was clean on the day the rules arrived - 0 blocker, 0 required,
# 0 advisory - after two MLP001 blockers it found were fixed. So there is
# deliberately no mlp_lint_baseline.json here. The upstream repository needs
# one because its rules postdate its packages; this one starts from green and
# should stay there. If a finding ever genuinely has to be deferred, run
# `python3 scripts/mlp_lint.py --update-baseline` and say in the pull request
# why it is being carried rather than fixed.
#
# Two jobs, because source and artifact fail differently:
#
#   rules  - lints package source. Fast, runs on plain python3, no container.
#   build  - actually builds the package and audits the zip it produced.
#
# The build job is the one that would have caught the incident above end to
# end. Several rules can only be evaluated against the real generated manifest
# (a duplicated install destination, a beans entry naming a module that was
# never shipped, a shipped files.md5), and linting pack.php instead is
# guesswork. It also means a change that breaks packaging - an edit to
# pack.php, a file moved out from under an installdef - fails here rather than
# at the moment somebody tries to upload the result.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules:
    name: Package rules (source)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # G318. The linter below is upstream's, byte for byte, at the commit
      # scripts/mlp_lint.PINNED.json names, and has all 19 rules. A hand edit,
      # a partial sync or a stale copy fails HERE, before the audit can pass
      # on the strength of a linter that no longer checks what it claims to.
      - name: The linter is upstream's, unedited
        run: |
          python3 scripts/tests/test_mlp_lint_pin.py -v
          python3 scripts/mlp_lint.py --explain MLP019

      # The linter's own tests. A linter nobody trusts gets disabled, and the
      # way it loses trust is a false positive, so every rule is tested on a
      # fixture that must fire and on the fixed version that must not. If
      # these fail, nothing below means anything.
      - name: Self-tests
        run: python3 scripts/tests/test_mlp_lint.py

      - name: Audit the package
        run: python3 scripts/mlp_lint.py

      # Advisory findings never gate. Printed so they stay visible rather than
      # accumulating silently behind a passing check.
      - name: Full report
        if: always()
        run: python3 scripts/mlp_lint.py --fail-on advisory || true

  build:
    name: Build and audit the artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pack.php needs ZipArchive, which php:8.2-cli does not ship.
    container:
      image: php:8.2-cli
    steps:
      # nodejs (G574): test_g574_g578_bench_quote_pickers's premise test reads
      # this package's option list the way the BROWSER does (JSON.parse, where
      # integer-like keys come first). Without node it would skip here, silently
      # spending the skip ceiling's one slack.
      - name: Install the zip extension and python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libzip-dev zip unzip python3 python3-pytest nodejs
          docker-php-ext-install zip
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Built the way a release is built. A failure here is a packaging
      # failure: pack.php no longer runs, or an installdef points at a file
      # that has moved.
      #
      # Every package under sugar-sell that has a builder, not just the main
      # one. The disposable one-off repairs are real packages that install into
      # a live instance, and a builder that nothing exercises is a builder that
      # breaks quietly and is discovered at the worst moment - halfway through
      # fixing a broken instance.
      # Every shipped .php file parses under the PHP the instances run. A
      # parse error in a logic hook is a white screen for every seller on the
      # next install, and nothing here looked for it: pack.php zips bytes, the
      # linter reads the ASTs its rules target, the PHP suites load the files
      # they name (8 of the 21 shipped files are loaded by none). 27 files
      # today, 0 failures, ~2s. archive/ is included: its one-off is excluded
      # from build and lint on purpose, never from parsing. The count of
      # "No syntax errors" lines is asserted against the file count — the
      # population, not the exit code — so a wrong search reads as an error.
      - name: Every shipped PHP file parses (php -l)
        run: |
          find sugar-sell archive -name '*.php' -not -path '*/releases/*' -print0 | sort -z > php-files.zlist
          total=$(tr -cd '\0' < php-files.zlist | wc -c | tr -d ' ')
          xargs -0 -n 1 sh -c 'php -l "$0" 2>&1 || true' < php-files.zlist > php-l.out
          ok=$(grep -c '^No syntax errors detected' php-l.out || true)
          echo "php files: $total, parsed clean: $ok"
          if [ "$total" -lt 20 ]; then
            echo "::error::only $total .php files found under sugar-sell/archive; the search is wrong"
            exit 1
          fi
          if [ "$ok" -ne "$total" ]; then
            grep -E '^(PHP )?(Parse|Fatal) error|^Errors parsing' php-l.out | sort -u | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build every package
        run: |
          set -e
          for pack in sugar-sell/*/pack.php; do
            dir=$(dirname "$pack")
            echo "::group::$dir"
            (cd "$dir" && php pack.php)
            echo "::endgroup::"
          done

      # What the loader will actually be handed. Asserts the things that are
      # only true of a built artifact: manifest.php at the archive ROOT (one
      # directory down and the upload fails outright with
      # NoPackageManifestFileException), and the version inside the manifest
      # matching the package's own version file - a mismatch produces a zip
      # Module Loader treats as "not an upgrade" and silently declines.
      - name: Check the artifact is loadable
        run: python3 scripts/check_built_packages.py

      # 🚩 THE WHOLE SUITE, and it runs HERE rather than in `rules` for a
      # measured reason: 10 of these tests assert things that are only true of a
      # BUILT package (manifest contents, installdefs, stage policy), so before
      # `Build every package` above they fail with FileNotFoundError on
      # releases/*.zip. After it: 166 passed, 1 skipped.
      #
      # 🛑 UNTIL NOW CI RAN EXACTLY ONE FILE — `scripts/tests/test_mlp_lint.py`.
      # There are 19. **156 passing tests never executed in CI**, which is the
      # same hole PR #52 found in erp-integration-sugar, where `unittest
      # discover` silently collected 652 of 892. A test that never runs is
      # documentation, not a guard: the G15 duplicate-button retirement had no
      # coverage at all until this commit, and nothing would have caught it
      # coming back.
      # 🛑 NO pip HERE. This job runs in php:8.2-cli (Debian trixie), where
      # `apt-get install python3` ships the interpreter and NOTHING else --
      # no pip3 binary and no `pip` module. The first version of this step
      # called `pip3 install ... pytest` and died `pip3: not found`, exit 127,
      # before a single test ran (PR #14). pytest comes from `python3-pytest`
      # in the apt line above instead: one layer fewer, no network install at
      # job time, and a version pinned by the base image rather than by
      # whatever PyPI serves that morning. The suite imports nothing outside
      # the standard library, so pytest is only the RUNNER here.
      #
      # `-m "not sugarent_tree"`: the tests that read SugarCRM's own source
      # are NOT COLLECTED here (why, and which, at the skip ceiling below).
      # `-rs` names every skip that remains, so a new one shows up by name in
      # this log instead of as one more `s` in a row of dots.
      - name: The whole test suite
        run: python3 -m pytest scripts/tests -q -rs -m "not sugarent_tree" | tee pytest.out

      # A collected-count floor. Asserting the exit code alone cannot see a
      # runner that silently stops collecting - exactly how the 652-of-892 hole
      # stayed invisible. Raise this number when the suite genuinely grows.
      - name: The suite actually collected its tests
        run: |
          COUNT=$(python3 -m pytest scripts/tests --collect-only -q 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || echo 0)
          echo "collected: $COUNT"
          # 160 was 44% of the population when this was re-measured on
          # 2026-09-26 (361 collected, run 36214583533): a collector that
          # silently dropped the 105 vendored linter tests AND 90 more would
          # still have passed. A floor that far below the count guards
          # nothing; 330 leaves room for a deletion, not for a hole.
          if [ "${COUNT:-0}" -lt 330 ]; then
            echo "::error::only $COUNT tests collected; expected >= 330. A collector that "
            echo "::error::silently declines to collect is indistinguishable from a passing suite."
            exit 1
          fi

      # A skip CEILING, the twin of the collected floor above. The floor cannot
      # see a test that is collected and then skipped, and skipping is the
      # cheapest way to make a red suite green: one `skipUnless` on a class and
      # seven scenarios stop being evidence while the check stays green. That
      # is not hypothetical - it is exactly what this PR nearly shipped.
      #
      # 🛑 MEASURED UNDER CI CONDITIONS, NOT ON A DEVELOPER'S MACHINE. The rc67
      # version of this comment said 7 and CI ran 14 (run 35804953494): the 7
      # it did not name read ~/Documents/Code/SugarEnt-Full-*, which existed
      # where it was counted and does not exist here. To count what CI counts,
      # run the suite with HOME pointed at an empty directory (and
      # MLP_LINT_SUGAR_ROOT unset); at 0.9.42-rc68 that reproduces run
      # 35804953494's progress line character for character.
      #
      # Of those 14, 7 are NOT COLLECTED here, 2 more since rc69, 1 more
      # since rc74, 1 more with G574, 2 more with G809, 1 more with 🔒2085b
      # and 1 more with G817, so 15 in all. Each reads SugarCRM's own
      # source (licensed under the Master Subscription Agreement, no public
      # copy), so CI can never run them, and pinning excerpts would make them
      # fixtures that test their own belief. They declare
      # `requires_sugarent_tree = True`; scripts/tests/conftest.py turns that
      # into the `sugarent_tree` marker; the two pytest runs here pass
      # `-m "not sugarent_tree"`; and the step after this one fails if the set
      # left out is not exactly these 15:
      #   test_post_install_step_report SugarPlatformContractTest (6) - G294's
      #     platform facts (setInstallationError is public, post_execute
      #     require_once's inside its method, a throw force-uninstalls, the log
      #     is package_install.log, Diagnostic carries all three channels,
      #     config.value is text), read from SugarEnt-Full 25.2.0 and 26.1.0.
      #     They have NEVER run in CI; they run where a tree exists.
      #   test_g294_single_pass PlatformReservedScriptContractTest (2) - rc69,
      #     G294's second grade: PackageManager include()s the reserved
      #     scripts/{pre,post}_{install,uninstall}.php paths as well as the
      #     installdefs, which is why the lifecycle scripts moved off them.
      #     The anchor for that suite's stub, read from the same two trees.
      #   test_g450_suspect_account_type TheOrderRuleIsSugars (1) - rc74, G450
      #     (first built as the VOID rc71; revived by 🔒1783b):
      #     the extension-merge order (is_override first, then mtime, and the
      #     en_us filename filter) that makes the `_override` Suspect fragment
      #     merge after ERP-Core's whole-array account_type_dom, read from
      #     SugarEnt-Full 25.2.0 and 26.1.0. Its merge cases run here.
      #   test_g574_g578_bench_quote_pickers SugarsOwnEnumFieldOnTheCreateForm
      #     (1) - G574: SugarCRM's own EnumField (_checkForDefaultValue) run on
      #     the shipped Project def with the browser's key order, 25.2.0 and
      #     26.1.0: no pre-pick, and the control without defaultToBlank
      #     reproduces the measured "17879". Its PHP/JS premise runs here.
      #   test_g268_retired_stage_names test_merge_function_matches_sugar (1) -
      #     the transcribed getExtensionFileContents against 26.1.0's
      #     ModuleInstaller. It already skipped at rc65, when this comment named
      #     2 and CI counted 3, and was the one the rc65 slack absorbed.
      #   test_g809_connector_schema_safe ReferenceFormulaInSugarsOwnParser (2)
      #     - rc78, G809: the Reference dependency's formula evaluated by
      #     SugarCRM's own SugarLogic Parser (26.1.0), and the platform facts
      #     that make it browser-only (SetRequiredAction::fire only flips
      #     field_defs, a module dependency fires on save only with an
      #     'all'/'save' hook, populateFromApi has no `required` check).
      #   test_g809_connector_schema_safe GroupFormulaInSugarsOwnParser (1) -
      #     rc79, 🔒2085b / 🔒2086b: the Accounts Cust. Group formula, related()
      #     over the ERP company link, in SugarCRM's own SugarLogic Parser.
      #   test_g809_connector_schema_safe GroupCreateRequirementInSugarsOwnParser
      #     (1) - rc80, G817: Cust. Group's erp_customer_create_required_formula
      #     (the ADM gate the G805 create prompt asks about) in the same Parser.
      #     Its CI half (the served key, and nothing served required) runs here.
      #
      # The other 9 are collected and skipped, and each one is named:
      #   test_shared_fixture_drift (1) - by construction; it compares the
      #     pinned copies against the real erp-integration-sugar files and can
      #     only run where that checkout exists.
      #   test_mlp_lint_pin PinnedLinterDriftTest (1) - the same, for the
      #     vendored linter: pin versus upstream's branch head. Its twin,
      #     PinnedLinterIntegrityTest, runs here and gates the `rules` job.
      #   test_mlp_lint TestShippedPackagesStayClean (1) - wants a whole
      #     ERP-Epicor PACKAGE directory, which this repository never has.
      #   test_mlp_lint TestAgainstTheRealScanner (4) - run Sugar's own
      #     ModuleScanner, so need a SugarEnt tree CI does not have. Upstream
      #     skips them in its CI for the same reason. Where a tree exists they
      #     run over every PHP file here: at rc67 MLP002 and the real scanner
      #     agreed on all 61.
      #   test_g809_connector_schema_safe TheConnectorsOwnSchemaCheck (2) -
      #     rc78, G809 (a Quote) and rc79, 🔒2085b (an Account): run erp-integration-core's REAL describe_module and
      #     check_payload (another org's private repo, not checked out here) on
      #     the served Quotes fields, so needs the connector's Python. Its CI
      #     half, test_served_quote_fields_are_not_required, runs here.
      # Five are new with G318: the four TestAgainstTheRealScanner tests,
      # which arrived with upstream's re-vendored suite (105 tests where the
      # stale copy had 61) and are pinned byte for byte, so cannot be edited
      # into running here, nor into declaring `requires_sugarent_tree`; and
      # PinnedLinterDriftTest, which is G318's own.
      #
      # rc65 pinned the rest rather than skipping them: core's billing-country
      # guard, ERP-Epicor's createOppQuote (G243's control), the label that
      # collides with the retired Bench button (G15's root cause) and core's
      # button add-if-absent with the Quotes layout that drives it (G276). Those
      # four used to skip HERE, which is exactly where a control about core
      # matters most. The ceiling is 10, one above the named 9 (rc78 raised it
      # from 8 and rc79 from 9, for the two connector checks named above), so
      # one more may appear before it has to be argued for - the same slack
      # rc65 kept.
      #
      # Everything else that used to need that private repo now runs here
      # against fixtures/shared-sugar/ - see scripts/refresh_shared_fixtures.py.
      # Raise this number only with a reason written beside it.
      - name: The suite did not go quiet
        run: |
          # Read off the run above (tee'd to pytest.out; pipefail is GitHub's
          # default for `run`, so tee hides no red) rather than re-running the
          # whole suite — which doubled the job's time and was fail-OPEN: a
          # pytest crash in the re-run yielded SKIPPED=0 and passed.
          [ -s pytest.out ] || { echo "::error::pytest.out is missing or empty; the suite step did not run"; exit 1; }
          SKIPPED=$(tail -1 pytest.out | grep -oE '[0-9]+ skipped' | grep -oE '^[0-9]+' || echo 0)
          echo "skipped: $SKIPPED"
          if [ "${SKIPPED:-0}" -gt 10 ]; then
            echo "::error::$SKIPPED tests skipped; ceiling is 10. A test that is"
            echo "::error::collected and then skipped is documentation, not a guard."
            exit 1
          fi

      # The other half of the ceiling. `-m "not sugarent_tree"` is a way to
      # make a test vanish from CI without it ever counting as a skip, so the
      # set it removes is pinned BY NAME: marking one more test, unmarking one,
      # or deleting conftest.py (which leaves the marker on nothing) all fail
      # here. Change this list only with a reason written at the ceiling above.
      - name: Only the named SugarEnt-tree tests are left out
        run: |
          python3 -m pytest scripts/tests --collect-only -q --color=no -m sugarent_tree 2>/dev/null \
            | grep '::' | LC_ALL=C sort > /tmp/left-out.txt || true
          LC_ALL=C sort > /tmp/named.txt <<'EOF'
          scripts/tests/test_g268_retired_stage_names.py::RetiredStageNames::test_merge_function_matches_sugar
          scripts/tests/test_post_install_step_report.py::SugarPlatformContractTest::test_an_uncaught_throw_really_does_force_uninstall
          scripts/tests/test_post_install_step_report.py::SugarPlatformContractTest::test_module_loader_repoints_the_log_to_package_install
          scripts/tests/test_post_install_step_report.py::SugarPlatformContractTest::test_post_execute_require_onces_inside_its_own_method_body
          scripts/tests/test_post_install_step_report.py::SugarPlatformContractTest::test_set_installation_error_is_public_and_takes_a_string
          scripts/tests/test_post_install_step_report.py::SugarPlatformContractTest::test_the_config_value_column_is_text_not_a_short_varchar
          scripts/tests/test_post_install_step_report.py::SugarPlatformContractTest::test_the_diagnostic_tool_can_retrieve_all_three_channels
          scripts/tests/test_g294_single_pass.py::PlatformReservedScriptContractTest::test_sugar_includes_the_reserved_paths_after_the_installer
          scripts/tests/test_g294_single_pass.py::PlatformReservedScriptContractTest::test_the_installer_requires_the_installdef_inside_its_own_method
          scripts/tests/test_g450_suspect_account_type.py::TheOrderRuleIsSugars::test_the_order_rule_is_sugars
          scripts/tests/test_g574_g578_bench_quote_pickers.py::SugarsOwnEnumFieldOnTheCreateForm::test_the_shipped_project_def_is_left_blank_and_the_control_reproduces_17879
          scripts/tests/test_g809_connector_schema_safe.py::GroupCreateRequirementInSugarsOwnParser::test_the_create_requirement_in_sugars_own_parser
          scripts/tests/test_g809_connector_schema_safe.py::GroupFormulaInSugarsOwnParser::test_the_group_formula_in_sugars_own_parser
          scripts/tests/test_g809_connector_schema_safe.py::ReferenceFormulaInSugarsOwnParser::test_sugar_never_refuses_a_save_for_it
          scripts/tests/test_g809_connector_schema_safe.py::ReferenceFormulaInSugarsOwnParser::test_the_formula_in_sugars_own_parser
          EOF
          echo "left out of CI ($(wc -l < /tmp/left-out.txt)):"
          cat /tmp/left-out.txt
          if ! diff -u /tmp/named.txt /tmp/left-out.txt; then
            echo "::error::the tests CI does not collect are not the 15 named in mlp-lint.yml."
            echo "::error::A test left out of CI is not a guard; name it at the ceiling or run it."
            exit 1
          fi

      # The same rules again, this time over the real generated manifest.
      - name: Audit the built zip
        run: python3 scripts/mlp_lint.py --zips-from sugar-sell

      - name: Full artifact report
        if: always()
        run: python3 scripts/mlp_lint.py --zips-from sugar-sell --fail-on advisory || true

      # Kept so a failed run can be inspected, and so a reviewer can install
      # exactly what CI audited rather than rebuilding it locally.
      - name: Upload the package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mlp-package
          path: sugar-sell/*/releases/*.zip
          if-no-files-found: error
          retention-days: 14
