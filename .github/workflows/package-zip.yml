# Attaches the Bench Dogs MLP zip to a GitHub release, so it can be downloaded from
# the release page and uploaded by hand in Sugar's Module Loader.
#
# On a published release (or a manual run with the tag) this builds
# `sugarai_benchdogs_ext-<version>.zip` with the repository's own `pack.php`, where
# <version> is sugar-sell/BenchDogs-Ext/version. It FAILS if the release tag (minus a
# leading `v`) differs from that version, and it uploads the zip plus `<asset>.sha256`.
# pack.php dates the package by the commit that last changed its version file, so the
# checkout is a full clone.
name: Package zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to (e.g. v0.9.46-rc128)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build the package zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    # pack.php needs ZipArchive, which php:8.2-cli does not ship (as mlp-lint.yml notes).
    container:
      image: php:8.2-cli
    steps:
      - name: Install the zip extension and git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libzip-dev zip unzip git
          docker-php-ext-install zip
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: The release tag names the package version
        working-directory: sugar-sell/BenchDogs-Ext
        run: |
          VERSION=$(tr -d '[:space:]' < version)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match sugar-sell/BenchDogs-Ext/version ($VERSION)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build and check the zip
        working-directory: sugar-sell/BenchDogs-Ext
        run: |
          rm -rf releases
          php pack.php
          ASSET="sugarai_benchdogs_ext-${VERSION}.zip"
          test -f "releases/$ASSET"
          unzip -Z1 "releases/$ASSET" | grep -q '^manifest.php$'
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "releases/$ASSET" "$GITHUB_WORKSPACE/dist/"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum "$ASSET" > "$ASSET.sha256")
      - name: Summary
        run: |
          {
            echo "### Package zip for \`$TAG\`"
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-zip
          path: dist/
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # attach the asset to the release; nothing else needs it
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package-zip
          path: dist/
      - name: The downloaded zip still matches its hash
        run: cd dist && sha256sum -c ./*.sha256
      - name: Attach the zip and its hash to the release
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
